# =============================================================================
# CYBERGHOST OSINT ULTIMATE - Kubernetes Secrets
# =============================================================================
# Este arquivo contém exemplos de secrets. Em produção, use ferramentas como
# Sealed Secrets, External Secrets, ou HashiCorp Vault.
# NUNCA commite secrets reais no git!

apiVersion: v1
kind: Secret
metadata:
  name: cyberghost-secrets
  namespace: cyberghost
type: Opaque
stringData:
  # Database
  db-user: cyberghost  # cyberghost (plain text)
  db-password: <plain_text_db_password>
  
  # Redis
  redis-password: <plain_text_redis_password>
  
  # API Keys (exemplos - substitua pelos reais)
  shodan-key: <plain_text_shodan_key>
  virustotal-key: <plain_text_virustotal_key>
  github-token: <plain_text_github_token>
  
  # JWT Secret (para autenticação)
  jwt-secret: <plain_text_jwt_secret>
  
  # Encryption Key (para dados sensíveis)
  encryption-key: <plain_text_encryption_key>

---
apiVersion: v1
kind: Secret
metadata:
  name: cyberghost-tls
  namespace: cyberghost
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    <place_your_certificate_here>
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN RSA PRIVATE KEY-----
    <place_your_private_key_here>
    -----END RSA PRIVATE KEY-----

---
apiVersion: v1
kind: Secret
metadata:
  name: cyberghost-registry
  namespace: cyberghost
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "https://index.docker.io/v1/": {
          "username": "cyberghost",
          "password": "your-dockerhub-password",
          "email": "cyberghost@protonmail.com",
          "auth": "<plain_text_auth>"
        }
      }
    }