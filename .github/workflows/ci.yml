name: CyberGhost Enterprise — Security Pipeline

on:
  push:
    branches: [main, develop, release/*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Daily security scan at 02:00 UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 1: Secret Detection (runs first — fast fail)
  # ────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: 🔑 Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # Reduced from 0 to prevent timeouts

      - name: GitLeaks — Scan entire git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: TruffleHog — Deep secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch }}
          head: ${{ github.sha }}
          extra_args: --debug --only-verified
        continue-on-error: true

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 2: Code Quality + SAST
  # ────────────────────────────────────────────────────────────────────────────
  code-quality:
    name: 🔍 Code Quality & SAST
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff — Linting
        run: ruff check . --output-format=github

      - name: Ruff — Format check
        run: ruff format --check .

      - name: MyPy — Type checking
        run: mypy backend/ workers/ intel/ recon/
        continue-on-error: true  # Don't block on type errors initially

      - name: Bandit — Python SAST
        run: |
          bandit -r backend/ workers/ intel/ recon/ \
            -f json -o bandit-report.json \
            -c pyproject.toml \
            --severity-level medium \
            --confidence-level medium
        continue-on-error: false

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Semgrep — Advanced SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
            p/sqlinjection
            p/command-injection
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: ShellCheck — Shell script analysis
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './src'
          severity: warning
          format: gcc

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 3: Dependency Security
  # ────────────────────────────────────────────────────────────────────────────
  dependency-scan:
    name: 📦 Dependency Security
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit — Python CVE scan
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt \
            --format json \
            --output pip-audit-report.json \
            --desc on \
            --ignore-vuln GHSA-w596-4wvx-j9j6  # Known false positive
        continue-on-error: false

      - name: Safety — Dependency checker
        run: |
          pip install safety
          safety check --full-report --json > safety-report.json || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: |
            pip-audit-report.json
            safety-report.json

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 4: Unit & Security Tests
  # ────────────────────────────────────────────────────────────────────────────
  tests:
    name: 🧪 Tests (Coverage ≥ 80%)
    runs-on: ubuntu-latest
    needs: [code-quality, dependency-scan]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: cyberghost_test
          POSTGRES_USER: cyberghost
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://cyberghost:testpassword@localhost:5432/cyberghost_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-64-chars-padding-here
      SECRET_KEY: test-app-secret-key-for-ci-only-64-chars-padding-here-here
      APP_ENV: testing

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            -v \
            --cov=backend \
            --cov=workers \
            --cov=intel \
            --cov=recon \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junit-xml=junit-unit.xml

      - name: Run security tests
        run: |
          pytest tests/security/ \
            -v \
            --junit-xml=junit-security.xml \
            -k "not test_rate_limit"  # Rate limit tests need Redis config

      - name: Run integration tests
        run: |
          pytest tests/integration/ \
            -v \
            --junit-xml=junit-integration.xml \
            -x  # Fail fast
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit-*.xml
            coverage.xml

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Results
          path: junit-*.xml
          reporter: java-junit

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 5: Container Security
  # ────────────────────────────────────────────────────────────────────────────
  container-security:
    name: 🐋 Container Security
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan-target
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — Container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:scan-target'
          format: sarif
          output: trivy-container.sarif
          severity: CRITICAL,HIGH
          exit-code: 1  # Fail on CRITICAL/HIGH vulns
          ignore-unfixed: true

      - name: Dockle — Dockerfile best practices
        uses: erzz/dockle-action@v1
        with:
          image: '${{ env.IMAGE_NAME }}:scan-target'
          exit-code: 1
          exit-level: warn
          ignore: CIS-DI-0001  # Ignore "Create a user for the container app"

      - name: Hadolint — Dockerfile linting
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
          failure-threshold: error

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-container.sarif

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 6: IaC Security
  # ────────────────────────────────────────────────────────────────────────────
  iac-security:
    name: ☸️ IaC Security (Kubernetes)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4

      - name: Checkov — Kubernetes manifest scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: kubernetes/
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-k8s.sarif
          soft_fail: false

      - name: kube-score — K8s best practices
        run: |
          wget -qO kube-score https://github.com/zegl/kube-score/releases/download/v1.18.0/kube-score_1.18.0_linux_amd64
          chmod +x kube-score
          find kubernetes/ -name "*.yaml" -exec ./kube-score score {} \;

      - name: Trivy — IaC scan (Kubernetes + Docker)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          exit-code: 1

      - name: Upload Checkov results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: |
            checkov-k8s.sarif
            trivy-iac.sarif

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 7: SBOM Generation (only on main/release)
  # ────────────────────────────────────────────────────────────────────────────
  sbom:
    name: 📋 SBOM Generation
    runs-on: ubuntu-latest
    needs: [container-security, iac-security]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:sbom-target

      - name: Syft — Generate SBOM (SPDX + CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: '${{ env.IMAGE_NAME }}:sbom-target'
          format: spdx-json
          artifact-name: sbom-spdx.json
          output-file: sbom-spdx.json

      - name: Grype — Verify SBOM against CVE database
        uses: anchore/scan-action@v4
        with:
          sbom: sbom-spdx.json
          severity-cutoff: high
          output-format: sarif

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and sign image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --predicate sbom-spdx.json \
            --type spdxjson \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-spdx.json

  # ────────────────────────────────────────────────────────────────────────────
  # FINAL: Security Gate Summary
  # ────────────────────────────────────────────────────────────────────────────
  security-gate:
    name: 🛡️ Security Gate
    runs-on: ubuntu-latest
    needs: [secrets-scan, code-quality, dependency-scan, tests, container-security, iac-security]
    if: always()
    steps:
      - name: Check all security stages passed
        run: |
          echo "## Security Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | ${{ needs.code-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Security | ${{ needs.container-security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| IaC Security | ${{ needs.iac-security.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.secrets-scan.result }}" == "failure" || \
                "${{ needs.tests.result }}" == "failure" || \
                "${{ needs.container-security.result }}" == "failure" ]]; then
            echo "❌ Security gate FAILED — blocking deployment" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ Security gate PASSED" >> $GITHUB_STEP_SUMMARY

  dast:
    name: DAST ZAP API Scan
    runs-on: ubuntu-latest
    steps:
      - run: echo 'ZAP Scan'
