[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyberghost-osint"
version = "1.0.0"
description = "CyberGhost OSINT Community Edition - Zero Config Reconnaissance"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Leonardo Pereira Pinheiro", email = "cyberghost@protonmail.com" }
]

dependencies = [
    "aiohttp>=3.11.0",
    "rich>=13.9.0",
    "dnspython>=2.7.0",
    "stix2>=3.0.1",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
cyberghost = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules"]
